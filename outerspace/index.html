<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Uforiya</title>
  <meta name="description" content="Uforiya. Every track. Every version. Every collaborator. Nothing lost." />
  <meta name="theme-color" content="#050507" />

  <link rel="icon" type="image/png" href="../images/ufo-faveicon.png" />
  <link rel="apple-touch-icon" href="../images/ufo-faveicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../style.css?v=8" />

  <style>
    /* One screen, no scrolling. The starfield canvas comes from style.css. */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    .space {
      position: relative;
      z-index: 1;
      height: 100vh;
      height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .space-logo {
      width: min(54vmin, 480px);
      height: min(54vmin, 480px);
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 38px rgba(123, 95, 245, 0.6));
      /* hover-drift is defined in style.css */
      animation:
        space-rise 1.6s cubic-bezier(0.2, 0.7, 0.3, 1) both,
        hover-drift 5.5s ease-in-out 1.6s infinite;
    }

    .space-wordmark {
      position: absolute;
      left: 0;
      right: 0;
      bottom: clamp(32px, 9vh, 96px);
      margin: 0;
      display: flex;
      justify-content: center;
      line-height: 0;
      pointer-events: none;
      user-select: none;
      animation: space-fade 2s ease 0.6s both;
    }

    .wordmark-wrap {
      position: relative;
      display: block;
      width: clamp(220px, 56vw, 620px);
    }

    .wordmark-wrap img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      -webkit-user-drag: none;
      filter: drop-shadow(0 0 18px rgba(123, 95, 245, 0.55));
    }

    /* Moon orbiting the ring around the O. Both layers share one path and
       start together; front shows on the bottom half, back on the top half
       so the letters hide it as it passes behind. */
    .moon-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 6px rgba(155, 127, 247, 0.85));
    }
    .moon-back  { z-index: 0; }
    .moon-front { z-index: 2; }

    @media (prefers-reduced-motion: reduce) {
      .moon-layer { display: none; }
    }

    @keyframes space-rise {
      from { opacity: 0; transform: translateY(22px) scale(0.94); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes space-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>

  <main class="space">
    <img src="../images/ufologo.png" alt="Uforiya" class="space-logo" draggable="false" />
    <h1 class="space-wordmark">
      <span class="wordmark-wrap">
        <svg class="moon-layer moon-back" viewBox="0 0 3000 382" aria-hidden="true">
          <defs>
            <radialGradient id="moon-grad" cx="35%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="55%" stop-color="#d9cfff" />
              <stop offset="100%" stop-color="#8f78f0" />
            </radialGradient>
            <path id="moon-orbit" fill="none" d="M 1572.5 125.8 A 465 106 -8 1 1 651.5 255.2 A 465 106 -8 1 1 1572.5 125.8" />
          </defs>
          <g>
            <circle r="52" fill="#9b7ff7" opacity="0.22" />
            <circle r="28" fill="url(#moon-grad)" />
            <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"><mpath href="#moon-orbit" /></animateMotion>
            <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite" />
          </g>
        </svg>
        <img src="../images/uforiya-wordmark-white.png" alt="Uforiya" draggable="false" />
        <svg class="moon-layer moon-front" viewBox="0 0 3000 382" aria-hidden="true">
          <g>
            <circle r="52" fill="#9b7ff7" opacity="0.22" />
            <circle r="28" fill="url(#moon-grad)" />
            <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear"><mpath href="#moon-orbit" /></animateMotion>
            <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite" />
          </g>
        </svg>
      </span>
    </h1>
  </main>

  <script src="/outerspace/deepspace.js?v=1"></script>
</body>
</html>
